services:
  api:
    build: .
    env_file: .env
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/app/data
      - ./secrets:/srv/app/secrets:ro
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: python -m app.worker
    volumes:
      - ./data:/srv/app/data
      - ./secrets:/srv/app/secrets:ro
    restart: unless-stopped
